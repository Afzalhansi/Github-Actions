name: Docker Matrix Build and Push

on:
  push:
    branches: [main]

env:
  CONTAINER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
  IMAGE_NAME: github-actions-nginx

jobs:
  docker-matrix:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Build for multiple CPU architectures or image variants
        platform: [linux/amd64, linux/arm64]
        tag: [latest, v1.0]

        # Optional: Exclude combinations you don't need (e.g., only build v1.0 for amd64)
        exclude:
          - platform: linux/arm64
            tag: v1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required to build images for non-native architectures like arm64 on an amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login $CONTAINER_REGISTRY --username $DOCKER_USERNAME --password-stdin

      - name: Docker Build and Push (${{ matrix.platform }} - ${{ matrix.tag }})
        run: |
          docker build build \
            --platform ${{ matrix.platform }} \
            --tag $CONTAINER_REGISTRY/$DOCKER_USERNAME/$IMAGE_NAME:${{ matrix.tag }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }} \
            --push .
