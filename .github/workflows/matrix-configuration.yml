name: Matrix Strategy Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Run the job on every OS defined in the matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # Set to false so one failed combination doesn't cancel the other running jobs
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]

        # Optional: Exclude a specific OS + version combination
        exclude:
          - os: macos-latest
            node-version: 18

        # Optional: Include an extra custom combination or variable
        include:
          - os: ubuntu-latest
            node-version: 22
            is-primary: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run extra check on primary build
        if: matrix.is-primary == true
        run: echo "Running primary Ubuntu + Node 22 verification!"
