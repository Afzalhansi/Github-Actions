name: Dragon Workflow
on: [push]

jobs:
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cowsay Program
        run: sudo apt-get update && sudo apt-get install cowsay -y

      - name: Execute Cowsay CMD
        run: /usr/games/cowsay -f dragon "Run for cover, I am a DRAGON....RAWR" >> dragon.txt

      - name: Upload Dragon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragon-file
          path: dragon.txt

  test_job_2:
    needs: build_job_1
    runs-on: ubuntu-latest
    steps:
      - name: Download Dragon Artifact
        uses: actions/download-artifact@v4
        with:
          name: dragon-file

      - name: Test File Exists
        run: grep -i "dragon" dragon.txt

  deploy_job_3:
    needs: test_job_2
    runs-on: ubuntu-latest
    steps:
      - name: Download Dragon Artifact
        uses: actions/download-artifact@v4
        with:
          name: dragon-file

      - name: Read File
        run: cat dragon.txt

      - name: Deploy
        run: echo Deploying ... .. .
