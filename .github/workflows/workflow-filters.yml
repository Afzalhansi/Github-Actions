name: Exploring workflow filters and activities

on:
  workflow_dispatch:

  push:
    branches-ignore:
      - feature/*
      - test/*

  pull_request:
    types:
      - opened
      - closed
    paths-ignore:
      - README.md
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print event type
        run: echo "This workflow/job/step was executed. Event type: ${{ github.event_name }}"